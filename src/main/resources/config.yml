# Версия управляемого шаблона; существующие значения не заменяются.
config-version: 1
# Все найденные поддерживаемые таблички и текстовые дисплеи обслуживаются вместе.
# Проверка уже собранных ajLeaderboards данных, в тиках (20 = секунда).
# Не меняет stat-refresh и не собирает статистику игроков самостоятельно.
refresh-ticks: 100
# Срок подготовки голов в секундах. При ошибке старый полный снимок сохраняется.
prepare-timeout-seconds: 15
# Не запрашивать повторно готовую текстуру чаще этого времени.
skin-cache-seconds: 600
